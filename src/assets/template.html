<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeckGL Visualization</title>
    <script src="https://unpkg.com/deck.gl@9.0.16/dist.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #deck-container {
            width: {{WIDTH}};
            height: {{HEIGHT}};
            position: relative;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #deck-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="deck-container">
        <div id="map"></div>
        <canvas id="deck-overlay"></canvas>
    </div>
    <script>
        const spec = {{SPEC_JSON}};

        // Process accessor strings that start with "@@="
        function processAccessor(value, obj) {
            if (typeof value === 'string' && value.startsWith('@@=')) {
                const path = value.slice(3);
                return (d) => {
                    const parts = path.split('.');
                    let result = d;
                    for (const part of parts) {
                        result = result[part];
                    }
                    return result;
                };
            }
            return value;
        }

        // Process layer specification
        function processLayer(layerSpec) {
            const layerType = layerSpec['@@type'];
            const LayerClass = deck[layerType];

            if (!LayerClass) {
                console.error('Unknown layer type:', layerType);
                return null;
            }

            const props = {};
            for (const [key, value] of Object.entries(layerSpec)) {
                if (key === '@@type') continue;
                props[key] = processAccessor(value, null);
            }

            return new LayerClass(props);
        }

        // Create layers
        const layers = spec.layers.map(processLayer).filter(l => l !== null);

        // Check if we have a map style
        if (spec.mapStyle) {
            // Create MapLibre map first
            const map = new maplibregl.Map({
                container: 'map',
                style: spec.mapStyle,
                center: [spec.initialViewState.longitude, spec.initialViewState.latitude],
                zoom: spec.initialViewState.zoom,
                pitch: spec.initialViewState.pitch || 0,
                bearing: spec.initialViewState.bearing || 0,
                interactive: false  // deck.gl will handle interaction
            });

            // Create deck.gl overlay
            new deck.DeckGL({
                canvas: 'deck-overlay',
                initialViewState: spec.initialViewState,
                controller: spec.controller,
                layers: layers,
                getTooltip: spec.pickable ? ({object}) => object && JSON.stringify(object) : null,
                onViewStateChange: ({viewState}) => {
                    map.jumpTo({
                        center: [viewState.longitude, viewState.latitude],
                        zoom: viewState.zoom,
                        pitch: viewState.pitch,
                        bearing: viewState.bearing
                    });
                }
            });
        } else {
            // No base map - hide the map div and use deck.gl directly
            document.getElementById('map').style.display = 'none';
            document.getElementById('deck-overlay').style.display = 'none';

            new deck.DeckGL({
                container: 'deck-container',
                initialViewState: spec.initialViewState,
                controller: spec.controller,
                layers: layers,
                getTooltip: spec.pickable ? ({object}) => object && JSON.stringify(object) : null
            });
        }
    </script>
</body>
</html>
